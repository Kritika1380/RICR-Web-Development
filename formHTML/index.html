<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <div>
        <label for="fullName">Full name :</label>
        <input type="fullName" id="Fullname" placeholder="enter your name" />
      </div>

      <br />

      <div>
        <label for="email">Email:</label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="enter your email"
        />
      </div>

      <br />

      <div>
        <label for="password">password:</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="choose your password"
        />
      </div>

      <br />

      <div>
        <label for="password"> confirm password:</label>
        <input
          type="confipassword"
          name="confipassword"
          id="confipassword"
          placeholder="confirm password"
        />
      </div>

      <br />

      <div>
        <label for="Phone">Phone:</label>
        <input
          type="number"
          name="phone"
          id="phone"
          placeholder="mobile number"
        />
      </div>

      <br>

      <div>
        <label for="dob">date of birth</label>
        <input type="date" name="dob" id="dob" />
      </div>

      <br>

      <div>
        <label for="tob"> time of birth</label>
        <input type="time" name="tob" id="tob">
      </div>

      <br>

      <div>
        <label for="timedate">time and date of birth : </label>
        <input type="datetime-local" name="timedate" id="timedate">
      </div>

      <br>

      <div>
        <label for="resume">resume</label>
        <input type="file" name="resume" id="resume">
      </div>

      <br>

      <div>
        <label for="volume">volume</label>
        <input type="range" name="volume" id="volume" min="0" max="10" value="d2">
      </div>

      <br>

      <div>
        <label for="gender">Gender</label>
        <input type="radio" name="gender" id="gendermale" value="male"> <span>Male</span>
        <input type="radio" name="gender" id="genderfemale" value="female"> <span>female</span>
        <input type="radio" name="gender" id="genderother" value="other"> <span>other</span>
      </div>

      <br>

      <div>
        <label for="Qualification">Qualification</label>
        <select name="Qualification" id="Qualification"></select>
        <option value="">--select--</option>
        <option value="highschool">High School</option>
        <option value="bachelor">Bachelor</option>
        <option value="master">Master</option>
        <option value="PHD">PHD</option>
      </div>

      <br>

      <div>

      </div>

      <button></button>
    </div>
  </body>
</html>
