<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    /> 
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="text-center pt-5 gap-5 pt-3  " id="mainDiv">
      <b><h1>Electricity Bill Calculator</h1> </b>
      <div class="container pt-3">
        <label for="Electricity">Electricity Units :</label>
        <input type="number" name="ElectricityUnits" id="ElectricityUnits" placeholder="Enter unit"/>
        <div class="gap-5">
          <button class="btn btn-primary mt-3 gap-2" onclick="Calculate()">
            Calculate
          </button>
          <button class="btn btn-success mt-3 gap-2" onclick="Reset()">Reset/Clear</button>
          <div class="mt-3">
            <p id="result"></p>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
