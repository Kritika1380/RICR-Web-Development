<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" cellspacing="0" cellpadding="10">
        <tr>
            <td>
                <div>
                    <div>
                        <h2>Pizza Order Form</h2>
                        <br>
                        <label for="FirstName">First Name:</label>
                        <input type="text" name="FirstName" id="FirstName">
                        <br> <br>
                        <label for="LastName">Last Name:</label>
                        <input type="text" name="LastName" id="LastName">
                        <br><br>
                        <label for="EmailAddress">Email Address:</label>
                        <input type="text" name="EmailAddress" id="EmailAddress">
                        <br><br>
                        <label for="ConatctNumber">ConatctNumber:</label>
                        <input type="text" name="ConatctNumber" id="ConatctNumber">
                        <br><br>
                        <label for="PreferredDeliveryDate">Preferred Delivery Date:</label>
                        <input type="date" name="PreferredDeliveryDate" id="PreferredDeliveryDate">
                        <br><br>
                        <label for="Size">Size:</label>
                        <br>
                        <input type="radio" name="Size" id="SizeSmall" value="Small">
                        <span>Small</span>
                        <input type="radio" name="Size" id="SizeMedium" value="Medium">
                        <span>Medium</span>
                        <input type="radio" name="Size" id="SizeLarge" value="Large">
                        <span>Large</span>
                        <br><br>
                    </div>

                    <div>
                        <label for="Flavor">Flavor:</label>
                        <br>
                        <div>     
                        <input type="checkbox" name="Flavor" id="checkbox">
                        <span>Hawaiian(Php 150.00)</span>
                        <select name="quantity" id="quantity">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                        </div>
                        <div>
                            <input type="checkbox" name="flavor" id="checkbox">
                            <span>Pepperoni</span>
                            <select name="quantity" id="quantity">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                            </select>
                        </div>
                        <div>
                            <input type="checkbox" name="flavor" id="checkbox">
                            <span></span>
                        </div>
                       

                    </div>
                </div>
           
            </td>
        </tr>
    </table>
</body>
</html>
