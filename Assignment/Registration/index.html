<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coaching Registration Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-light">
    <header class="position-sticky top-0 z-3">
      <div
        class="container-fluid bg-primary px-3 py-1 d-flex justify-content-between "
      >
        <div class="d-flex gap-3">
          <img
            src="../Registration/beautiful-flowers-lotus.webp"
            alt=""
            width="40px"
            height="50px"
            class="rounded-circle"
          />
          <h1 class="text-light">Registration Form</h1>
        </div>

        <button class="btn btn-info">Student Login</button>
      </div>
    </header>

    <main>
      <div class="container bg-white border rounded shadow p-3 mt-3">
        <div class="border border-dark rounded p-3 pt-5 position-relative rounded-3">
          <span class="px-2 fs-5 position-absolute bg-white text-primary" style="top: -15px"
            >Personal Information</span
          >
          <div class="d-grid gap-3">

            <div class="d-flex align-items-center">
              <label for="fullName" class="form-label w-25">Full Name :<sup class="text-danger">*</sup> </label>
              <input
                type="text"
                name="fullName"
                id="FullName"
                class="form-control"
              />
            </div>
            <div class="d-flex align-items-center">
              <label for="email" class="form-label w-25">Email Address :<sup class="text-danger">*</sup> </label>
              <input type="email" name="email" id="Email" class="form-control" />
            </div>
            <div class="d-flex align-items-center">
              <label for="number" class="form-label w-25">Mobile Number :<sup class="text-danger">*</sup> </label>
              <input
                type="number"
                name="number"
                id="Number"
                class="form-control"
              />
            </div>
            <div class="d-flex align-items-center">
              <label for="dob" class="form-label w-25">D.O.B : <sup class="text-danger">*</sup></label>
              <input
                type="date"
                name="dob"
                id="DateOfBirth"
                class="form-control"
              />
            </div>
          </div>
        </div>

        <!-- Academic Details  -->
        <div class="border border-dark rounded p-3 pt-5 my-3 position-relative">
          <span class="px-2 fs-5 position-absolute bg-white" style="top: -15px"
            >Academic Details</span
          >
          <div class="d-grid gap-3">
            <div class="d-flex align-items-center">
              <label for="fullName" class="form-label w-25"
                >Qualification: <sup class="text-danger">*</sup></label
              >
              <select
                name="qualification"
                id="qualification"
                class="form-control"
              >
                <option value="">--Select Qualification</option>
                <option value="10">Secondary Schooling</option>
                <option value="12">Senior Secondary Schooling</option>
                <option value="UG">Graduation</option>
                <option value="PG">Post Graduation</option>
                <option value="PHD">P.hd</option>
              </select>
            </div>

            <div class="d-flex align-items-center">
              <label for="Score" class="form-label w-25"
                >Percentage / Grade : <sup class="text-danger">*</sup>
              </label>
              <input
                type="text"
                name="score"
                id="Score"
                class="form-control"
                required
              />
            </div>
          </div>
        </div>

        <!-- course Information -->
        <div class="border border-dark rounded p-3 pt-5 my-3 position-relative">
          <span class="px-2 fs-5 position-absolute bg-white" style="top: -15px"
            >Course Information</span
          >
          <div class="d-grid gap-3">
            <div class="d-flex align-items-center">
              <label for="course" class="form-label w-25"
                >Available Courses : <sup class="text-danger">*</sup>
              </label>
              <select name="course" id="course" class="form-select">
                <option value="">--Select Course</option>
                <option value="FSD">Full Stack Development</option>
                <option value="DS">Data Science</option>
                <option value="DA">Data Analytics</option>
                <option value="J-DSA">Java DSA</option>
                <option value="P-DSA">Python DSA</option>
              </select>
            </div>
            <div class="d-flex align-items-center">
              <label for="batch" class="form-label w-25"
                >Perfered Batch : <sup class="text-danger">*</sup>
              </label>
              <div class="d-flex gap-3">
                <div class="d-flex gap-2">
                  <input
                    type="checkbox"
                    name="batch"
                    id="morning"
                    value="morning"
                    class="form-check-input"
                    style="accent-color: red !important"
                  />
                  <span>Morning</span>
                </div>
                <div class="d-flex gap-2">
                  <input
                    type="checkbox"
                    name="batch"
                    id="afternoon"
                    value="afternoon"
                    class="form-check-input"
                  />
                  <span>Afternoon</span>
                </div>
                <div class="d-flex gap-2">
                  <input
                    type="checkbox"
                    name="batch"
                    id="evening"
                    value="evening"
                    class="form-check-input"
                  />
                  <span>Evening</span>
                </div>
                <div class="d-flex gap-2">
                  <input
                    type="checkbox"
                    name="batch"
                    id="weekends"
                    value="weekends"
                    class="form-check-input"
                  />
                  <span>Weekends</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Address -->
         
        <div class="border border-dark rounded p-3 pt-5 my-3 position-relative rounded-3">
          <span class="px-2 fs-5 position-absolute bg-white " style="top: -15px"
            >Address</span
          >
          <div class="d-grid gap-3">

            <div class="d-flex align-items-center">
              <label for="address" class="form-label w-25">Residentail Address :<sup class="text-danger">*</sup> </label>
              <input
                type="text"
                name="address"
                id="Address"
                class="form-control"
              />
            </div>
            <div class="d-flex align-items-center">
              <label for="city" class="form-label w-25">City :<sup class="text-danger">*</sup> </label>
              <input type="text" name="city" id="City" class="form-control" />
            </div>
            <div class="d-flex align-items-center">
              <label for="Pincode" class="form-label w-25">Pin Code :<sup class="text-danger">*</sup> </label>
              <input
                type="tel"
                name="pinCode"
                id="Pincode"
                class="form-control"
              />
            </div>
          </div>
        </div>
        <!-- Graduation Details -->

        <div class="border border-dark rounded p-3 pt-5 my-3 position-relative rounded-3">
            <span class="px-2 fs-5 position-absolute bg-white " style="top: -15px"
              >Graduation Details</span
            >
          <div class="d-grid gap-3">

            <div class="d-flex align-items-center">
              <label for="address" class="form-label w-25">Graduation Name :<sup class="text-danger">*</sup> </label>
              <input
                type="text"
                name="graduationName"
                id="graduationName"
                class="form-control"
              />
            </div>
            <div class="d-flex align-items-center">
              <label for="graduationNumber" class="form-label w-25">Graduation Number :<sup class="text-danger">*</sup> </label>
              <input type="text" name="graduationNumber" id="GraduationNumber" class="form-control" />
            </div>
          </div>
        </div> 

        <!-- Additional Information -->
         <div class="border border-dark rounded p-3 pt-5 my-3 position-relative rounded-3">
            <span class="px-2 fs-5 position-absolute bg-white " style="top: -15px"
              >Additional Information</span
            >
            <div class="d-grid gap-3">
              <div class="d-flex align-items-center">
                <label for="coachingInfo" class="form-label w-25">How did you hear about us?:<sup class="text-danger">*</sup></label>
                <select name="coachingInfo" id="coachingInfo" class="form-select">
                  <option value="">--Select <Option></Option></option>
                  <option value="Friend">Friends</option>
                  <option value="ads">Online Ads</option>
                  <option value="newspaper">Newspaper</option>
                  <option value="socialMedia">Social Media</option>
                  <option value="other">Other</option>
                </select>
              </div>
            </div>
          </div>
          <div class="text-center"><button class="btn btn-primary text-white rounded-5 px-4 py-2 my-3" onclick="sumbit()">Sumbit</button>
          </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
