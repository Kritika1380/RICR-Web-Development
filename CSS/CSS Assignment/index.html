<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="mainform">
      <h1><span>Lo</span>gin</h1>

      <div id="login">
        <label for="email">&#993;</label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter your email"
        />
        <hr />

        <label for="password">&#128274;</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Confirm a password"
        />

        <div id="remember">
          <input type="checkbox" name="remember" id="remember" />
          <label for="remember">Remember me</label>
          <a href="#" id="forget">Forget password?</a>
        </div>
        <div id="loginButton">
          <button>Login Now</button>
          <br />
          <p id="signup">Don't have an account? <a href="">Signup now</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
